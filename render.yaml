services:
  - type: worker
    name: otc-live-ai-telegram
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BINOMO_EMAIL
        sync: false
      - key: BINOMO_PASSWORD
        sync: false
      - key: BINOMO_DEVICE_ID
        sync: false

